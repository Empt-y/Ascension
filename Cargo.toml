[workspace]
resolver = "3"
members = ["crates/asc-world", "crates/asc-render", "crates/asc-build", "crates/asc-game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
asc-world = { path = "crates/asc-world" }
asc-render = { path = "crates/asc-render" }
asc-build = { path = "crates/asc-build" }
wgpu = "30"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
fastnoise-lite = "1.1"
crossbeam-channel = "0.5"
ahash = "0.8"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["links", "wayland", "x11"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
postcard = { version = "1", features = ["use-std"] }
dirs = "6"
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
pollster = "0.4"
thread-priority = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
