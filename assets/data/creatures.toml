# Wild creatures: where they live, in what numbers, how they're drawn, and how they behave.
#
# Herds are placed by asc_sim::creatures, deterministically from the seed: the world is split into
# 96 m cells, and each cell near the player may hold one herd on land and one in its water. Its
# biome (at the cell's middle) gives each kind's chance of being the one there.
#
# Where they live and how they're drawn:
#   name       shown to the player ("Stag"), and in "was killed by a stag"
#   model      assets/models/creatures/<model>.glb; `models` to pick among (each member at random),
#              and `leader` for the herd's first member (a bull with the cows)
#   habitat    "land", "fresh" (rivers and lakes) or "sea"
#   biomes     chance per cell of a herd of this kind, by biome (land); `chance` for water kinds
#   herd       how many in a herd (inclusive range)
#   spread     how far from the herd's middle members stand (m)
#   scale      model scale: the models are authored two to five times life size, so each is
#              scaled to its animal's real height to the top of its head (or length, for swimmers)
#   idle       clips a land animal cycles through while it has nothing to do
#   sleep, eat its sleeping and eating (and drinking) clips (default Idle_Headlow, Eating)
#   swim       a swimmer's clip
#   depth      swimmers: the water must be at least this deep (m)
#   min_height land: only on ground above this (m)
#
# Its body and how it moves:
#   health     hit points (the player has 1000; bare fists do 60 a blow); a herd's leader has 30% more
#   radius, height   life size (m): how wide (it keeps out of gaps narrower) and tall its body is
#   walk, run  speeds (m/s); swimmers: cruising and bursting
#   stride     the speeds its walk and run clips' feet keep up with (m/s): the clips play faster or
#              slower to match how fast it's going
#   turn       how fast it turns (radians a second); stamina: seconds it can run flat out
#   max_slope  the steepest ground it climbs (rise over run); wade: the deepest water it wades (m)
#
# How it behaves:
#   sight, hearing   how far it sees (m, in daylight; less at night unless it's a night animal) and
#              how keen its ears are (1 normal)
#   flee       it runs from the player coming nearer than this (m); further once it's wary
#   wariness   0..1 how quickly it learns to fear the player (chased, hurt, herd-mates killed)
#   aggression 0..1 the chance it turns on whatever hurt it rather than running
#   guard      the herd's leader charges the player coming near a wary herd
#   curious    comes to look at the player when calm
#   activity   "day", "dusk" (dawn and dusk) or "night": when it's up and about (it sleeps otherwise)
#   diet       "graze" (walks to grass and eats), "hunt" (its pack hunts `prey`, and `big_prey` only
#              when very hungry) or "forage" (swimmers, foxes: they find their own)
#   attack     clip, damage, reach (m), windup (seconds until the blow lands), cooldown (seconds)
#   drops      what butchering its carcass gives: item and count range

[[creature]]
id = "stag"
name = "Stag"
models = ["stag"]
# 2.6 m with its antlers (model 4.2 m)
scale = 0.63
habitat = "land"
herd = [2, 5]
spread = 9.0
idle = ["Idle", "Idle_2", "Eating", "Idle_Headlow"]
biomes = { forest = 0.12, taiga = 0.08 }
health = 400
radius = 0.4
height = 1.4
walk = 1.4
run = 11.0
stride = [1.4, 10.0]
turn = 3.5
stamina = 25.0
max_slope = 1.0
wade = 0.9
sight = 70.0
hearing = 1.3
flee = 35.0
wariness = 0.8
aggression = 0.25
activity = "dusk"
attack = { clip = "Attack_Headbutt", damage = 150, reach = 1.8, windup = 0.45, cooldown = 1.8 }
drops = [{ item = "raw_meat", count = [4, 6] }, { item = "hide", count = [1, 2] }]

