# Natural scatter models: trees, shrubs, plants, grass, rocks and debris.
#
# Generated by tools/blender/nature.py (run `python tools/build_nature.py`), which builds each
# model with `builder` from `seed`, exports assets/models/nature/<id>.glb and checks its height
# against `height` (metres, origin at the ground; trunks and rocks sink a little below 0).
#
# Biomes (asc_world::Biome, chosen by climate, height and slope):
#   arctic   frozen: snowfields and ice          tundra   cold and dry: moss, low shrubs
#   taiga    cold and wet: pine forest           meadow   temperate grassland
#   forest   temperate broadleaf woods           swamp    temperate, wet and low: mud, willows
#   desert   hot and dry: dunes, cacti           savanna  hot, seasonal: yellow grass, acacias
#   jungle   hot and wet: dense broadleaf        shore    beaches and the strip above the sea

# How each kind is scattered and drawn.
#   distance   drawn out to this far (m); things fade out over the last `fade` metres
#   scale      random uniform scale range
#   sway       how much it moves in the wind
#   max_slope  not placed on ground steeper than this (rise over run)
#   shadow_distance  casts into the shadow cascades no wider than this (16, 50 or 120 m half-width;
#              0 for none): small things only need the near ones
#   collide    "trunk" (a capsule up the trunk), "rock" (a sphere), or "none"
#   mid_lod    beyond this distance draw the mid-distance model (<id>_mid.glb: the same model
#              without its twigs, with fewer, larger leaf cards, coarser grass and flowers)
#   lod        beyond this distance draw the impostor (<id>_far.glb: cards showing pictures of the
#              tree from three sides)

[kinds.tree]
distance = 600.0
fade = 40.0
scale = [0.8, 1.2]
sway = 1.0
max_slope = 0.7
shadow_distance = 200.0
collide = "trunk"
mid_lod = 25.0
lod = 70.0

[kinds.shrub]
distance = 160.0
fade = 30.0
scale = [0.75, 1.3]
sway = 0.6
max_slope = 0.9
shadow_distance = 50.0
collide = "none"
mid_lod = 15.0

[kinds.plant]
distance = 70.0
fade = 20.0
scale = [0.8, 1.25]
sway = 0.8
max_slope = 0.9
shadow_distance = 0.0
collide = "none"
mid_lod = 12.0

[kinds.grass]
distance = 45.0
fade = 15.0
scale = [0.8, 1.3]
sway = 1.0
max_slope = 1.0
shadow_distance = 0.0
collide = "none"
mid_lod = 10.0

[kinds.rock]
distance = 300.0
fade = 30.0
scale = [0.6, 1.5]
sway = 0.0
max_slope = 1.6
shadow_distance = 200.0
collide = "rock"

[kinds.debris]
distance = 120.0
fade = 25.0
scale = [0.8, 1.2]
sway = 0.0
max_slope = 0.5
shadow_distance = 16.0
collide = "none"

