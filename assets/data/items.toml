# Items. `color` (linear RGB) stands in for an icon until there is art.
# `places` names the terrain material the item fills with when placed; omit it for items that can't
# be placed. `stack` defaults to 64.
#
# Every ore in ores.toml also gets an item, added by the game: `<ore id>_ore`, named "<name> Ore",
# in the ore's colour.

[[item]]
id = "soil"
name = "Soil"
color = [0.30, 0.19, 0.10]
places = "soil"

[[item]]
id = "rock"
name = "Rock"
color = [0.36, 0.34, 0.33]
places = "rock"

[[item]]
id = "sand"
name = "Sand"
color = [0.80, 0.70, 0.46]
places = "sand"

[[item]]
id = "snow"
name = "Snow"
color = [0.88, 0.90, 0.96]
places = "snow"

[[item]]
id = "mud"
name = "Mud"
color = [0.15, 0.11, 0.07]
places = "mud"

[[item]]
id = "ice"
name = "Ice"
color = [0.62, 0.78, 0.92]
places = "ice"

[[item]]
id = "sandstone"
name = "Sandstone"
color = [0.56, 0.38, 0.23]
places = "sandstone"
