# Ores, GregTech: New Horizons style: many real minerals, found together in veins.
#
# Each ore gets two models from tools/blender/ores.py (run `python tools/build_ores.py`):
#   <id>_surface.glb  a small outcrop on the ground, hinting at the vein below (like GT's surface
#                     indicator rocks)
#   <id>_deep.glb     the vein itself underground: a bigger node on a flat base, for cave floors
#                     and walls
#
# Fields:
#   formula   chemical formula, shown in tooltips
#   tier      tool tier needed to mine it: 0 stone, 1 bronze, 2 steel, 3 aluminium, 4 stainless,
#             5 titanium
#   vein      which vein it belongs to (veins mix several ores; worldgen will place them)
#   style     how it looks: "metal" (veins and nuggets through the rock), "crystal" (hexagonal
#             prisms), "cubic" (cube crystals), "earthy" (lumpy patches), "banded" (strata)
#   color     linear base colour of the ore; metallic and roughness as in glTF

# --- Coal and lignite ---------------------------------------------------------------------------

[[ore]]
id = "coal"
name = "Coal"
formula = "C"
tier = 0
vein = "coal"
style = "earthy"
color = [0.025, 0.025, 0.03]
metallic = 0.0
roughness = 0.35

[[ore]]
id = "lignite"
name = "Lignite"
formula = "C2(H2O)4C"
tier = 0
vein = "coal"
style = "banded"
color = [0.07, 0.05, 0.035]
metallic = 0.0
roughness = 0.6

