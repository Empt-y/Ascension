# --- Veins -----------------------------------------------------------------------------------------
#
# Ores are found in veins, as in GregTech: a vein is a flattened, tilted lens of rock underground
# with its ores layered through it. `primary` fills the top third, `secondary` the bottom third,
# `between` the middle, and `sporadic` turns up anywhere in small amounts.
#
# How often each vein appears comes from how common its key element is in the crust:
#   weight = abundance_ppm ^ 0.25 * affinity(biome)
# so iron (56,300 ppm) is about 60 times as common as gold (0.004 ppm), not 14 million times, and
# rare ores stay findable. The fourth root keeps the real order while squashing the range. Coal and
# salt use their sedimentary abundance rather than crustal carbon or sodium.
#
#   depth      metres below the surface the vein's centre can sit at
#   radius     half-width of the lens (m); thickness is its full height (m)
#   affinity   per-biome multipliers for where the deposit really forms (unlisted biomes: 1)

[[vein]]
id = "coal"
abundance_ppm = 2000.0
primary = "coal"
secondary = "coal"
between = "coal"
sporadic = "lignite"
depth = [6.0, 70.0]
radius = [14.0, 24.0]
thickness = [4.0, 7.0]
# Coal is buried peat: old swamps and forests.
affinity = { swamp = 2.0, forest = 1.5, taiga = 1.4, jungle = 1.3, desert = 0.5, arctic = 0.6 }

[[vein]]
id = "lignite"
abundance_ppm = 800.0
primary = "lignite"
secondary = "lignite"
between = "lignite"
sporadic = "coal"
depth = [3.0, 35.0]
radius = [12.0, 20.0]
thickness = [3.0, 6.0]
# Young coal, close to the surface.
affinity = { swamp = 2.5, forest = 1.3, taiga = 1.2 }

[[vein]]
id = "limonite"
abundance_ppm = 56300.0
primary = "brown_limonite"
secondary = "yellow_limonite"
between = "banded_iron"
sporadic = "malachite"
depth = [10.0, 90.0]
radius = [14.0, 22.0]
thickness = [4.0, 7.0]
# Limonite is weathered iron: wetter ground.
affinity = { swamp = 1.6, jungle = 1.4, forest = 1.2, desert = 0.7 }

