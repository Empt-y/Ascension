# Building pieces: the grid and the exact size of every part.
#
# Read by the game (snapping, collision) and by tools/blender/parts.py (model generation), so a
# model can never drift from the grid. Sizes are [width x, height y, depth z] in metres, game axes
# (Y up). Changing a size here and re-running `python tools/build_parts.py` regenerates the models.

# Horizontal grid cell.
cell = 2.0
# Vertical snapping step.
height_unit = 0.5

# Origin conventions (what the model's (0,0,0) is):
#   foundation  centre of the footprint, bottom face
#   wall        centre of the base edge; length along x, thickness along z
#   ceiling     centre of the footprint, TOP face (it hangs below its top)

[parts.foundation]
name = "Foundation"
size = [2.0, 1.0, 2.0]
origin = "bottom"

[parts.wall]
name = "Wall"
size = [2.0, 2.0, 0.2]
origin = "bottom"

[parts.ceiling]
name = "Ceiling"
size = [2.0, 0.2, 2.0]
origin = "top"

# Tiers, in progression order. Costs will live here once crafting is designed; nothing reads
# them yet.
[[tier]]
id = "wood"
name = "Wood"

[[tier]]
id = "stone"
name = "Stone"

[[tier]]
id = "concrete"
name = "Concrete"

[[tier]]
id = "steel"
name = "Steel"
