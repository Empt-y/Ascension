# Terrain materials. Keys are the material names used by the engine (see asc_world::Material).
#
# hardness: seconds of holding the mine button per bite (one 0.9 m sphere).
# drop:     item id (items.toml) that mining yields, 1 item per cubic metre removed.
#
# `ore` covers every ore in ores.toml: each drops its own `<ore id>_ore` item, and takes `hardness`
# plus `tier_hardness` for each tool tier it needs.

[grass]
hardness = 0.5
drop = "soil"

[soil]
hardness = 0.4
drop = "soil"

[rock]
hardness = 1.5
drop = "rock"

[sand]
hardness = 0.3
drop = "sand"

[snow]
hardness = 0.2
drop = "snow"

[ore]
hardness = 2.0
tier_hardness = 0.6

[dry_grass]
hardness = 0.5
drop = "soil"

[moss]
hardness = 0.45
drop = "soil"

[mud]
hardness = 0.35
drop = "mud"

[ice]
hardness = 1.0
drop = "ice"

[sandstone]
hardness = 1.2
drop = "sandstone"

[basalt]
hardness = 1.8
drop = "basalt"

[obsidian]
hardness = 4.0
drop = "obsidian"

[pumice]
hardness = 0.8
drop = "pumice"

[ash]
hardness = 0.3
drop = "ash"

[sulfur]
hardness = 0.9
drop = "sulfur"
